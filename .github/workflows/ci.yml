name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"
  TEMPL_VERSION: "v0.3.1020"

jobs:
  test:
    name: vet + templates + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `make check` runs `buf breaking` against the main branch, so the
          # base ref must be present (a default shallow clone has only the head).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      # make check runs `make assets` -> `make css` -> `bun run css:build`,
      # which runs the Tailwind CLI out of node_modules. Without an install step
      # that directory never exists on a fresh runner and the build dies with
      # "Can't resolve 'tailwindcss'". The cache above only caches bun's own
      # download cache, not the installed tree.
      - name: Install node dependencies
        run: bun install --frozen-lockfile

      # make check is the single CI gate: gofmt cleanliness, templ
      # regeneration up-to-date, go vet and the full race-enabled suite.
      # (vet/test depend on `assets`, which generates templ + CSS first, so a
      # fresh checkout compiles the embedded output.css.)
      - name: make check
        run: make check

  docker:
    name: container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (PR smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gogo:ci
          build-args: |
            VERSION=${{ github.sha }}

      - name: Push tagged image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gogo:latest
            ghcr.io/${{ github.repository_owner }}/gogo:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}