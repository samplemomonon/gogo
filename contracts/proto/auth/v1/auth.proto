syntax = "proto3";

package auth.v1;

option go_package = "gogo/contracts/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

// Employee represents an employee in the auth system.
message Employee {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string email = 4;
  string role = 5;
  bool active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Session represents an authenticated session.
message Session {
  string id = 1;
  string tenant_id = 2;
  string employee_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp revoked_at = 6;
}

// RegisterEmployeeRequest requests employee registration.
message RegisterEmployeeRequest {
  string tenant_id = 1;
  string id = 2;
  string name = 3;
  string email = 4;
  string pin = 5;
  string role = 6;
}

// RegisterEmployeeResponse returns the registered employee.
message RegisterEmployeeResponse {
  Employee employee = 1;
}

// GetEmployeeRequest requests an employee by ID.
message GetEmployeeRequest {
  string tenant_id = 1;
  string id = 2;
}

// GetEmployeeResponse returns the employee.
message GetEmployeeResponse {
  Employee employee = 1;
}

// GetEmployeeByEmailRequest requests an employee by email.
message GetEmployeeByEmailRequest {
  string tenant_id = 1;
  string email = 2;
}

// GetEmployeeByEmailResponse returns the employee.
message GetEmployeeByEmailResponse {
  Employee employee = 1;
}

// UpdateEmployeeRequest requests an employee update.
message UpdateEmployeeRequest {
  string tenant_id = 1;
  string id = 2;
  string name = 3;
  string email = 4;
  string role = 5;
}

// UpdateEmployeeResponse returns the updated employee.
message UpdateEmployeeResponse {
  Employee employee = 1;
}

// ListEmployeesRequest requests a list of employees.
message ListEmployeesRequest {
  string tenant_id = 1;
  int32 limit = 2;
  // Session used for authorization. Tenant is always resolved from this session.
  string session_id = 3;
}

// ListEmployeesResponse returns a list of employees.
message ListEmployeesResponse {
  repeated Employee employees = 1;
}

// SetEmployeePINRequest requests a PIN change.
message SetEmployeePINRequest {
  string tenant_id = 1;
  string id = 2;
  string pin = 3;
}

// SetEmployeePINResponse is empty on success.
message SetEmployeePINResponse {}

// ActivateEmployeeRequest requests employee activation.
message ActivateEmployeeRequest {
  string tenant_id = 1;
  string id = 2;
}

// ActivateEmployeeResponse is empty on success.
message ActivateEmployeeResponse {}

// DeactivateEmployeeRequest requests employee deactivation.
message DeactivateEmployeeRequest {
  string tenant_id = 1;
  string id = 2;
}

// DeactivateEmployeeResponse is empty on success.
message DeactivateEmployeeResponse {}

// LoginRequest requests authentication.
message LoginRequest {
  string tenant_id = 1;
  string email = 2;
  string pin = 3;
}

// LoginResponse returns the session and employee.
message LoginResponse {
  Session session = 1;
  Employee employee = 2;
}

// LogoutRequest requests logout.
message LogoutRequest {
  string session_id = 1;
}

// LogoutResponse is empty on success.
message LogoutResponse {}

// ValidateSessionRequest validates a session.
message ValidateSessionRequest {
  string session_id = 1;
}

// ValidateSessionResponse returns the session and employee.
message ValidateSessionResponse {
  Session session = 1;
  Employee employee = 2;
}

// ExtendSessionRequest extends a session.
message ExtendSessionRequest {
  string session_id = 1;
}

// ExtendSessionResponse returns the extended session.
message ExtendSessionResponse {
  Session session = 1;
}

// CheckPermissionRequest asks the auth service to evaluate a supported
// capability against the current employee roles for this authenticated session.
message CheckPermissionRequest {
  string session_id = 1;
  string permission_key = 2;
}

// CheckPermissionResponse returns the deny-by-default decision.
message CheckPermissionResponse {
  bool allowed = 1;
}

message CreateRoleRequest {
  string session_id = 1;
  string name = 2;
  string description = 3;
  string change_reference = 4;
}
message CreateRoleResponse { string role_id = 1; }

message GrantPermissionRequest {
  string session_id = 1;
  string role_id = 2;
  string permission_key = 3;
  google.protobuf.Timestamp expires_at = 4;
  string reason = 5;
  string change_reference = 6;
}
message GrantPermissionResponse { string grant_id = 1; }

message RevokePermissionRequest {
  string session_id = 1;
  string grant_id = 2;
  string reason = 3;
  string change_reference = 4;
}
message RevokePermissionResponse {}

message AssignRoleRequest {
  string session_id = 1;
  string employee_id = 2;
  string role_id = 3;
  google.protobuf.Timestamp valid_from = 4;
  google.protobuf.Timestamp expires_at = 5;
  string reason = 6;
  string change_reference = 7;
}
message AssignRoleResponse { string assignment_id = 1; }

message RevokeRoleAssignmentRequest {
  string session_id = 1;
  string assignment_id = 2;
  string reason = 3;
  string change_reference = 4;
}
message RevokeRoleAssignmentResponse {}

message AuthorizationRole {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string active_permission_keys = 4;
}
message ListAuthorizationRolesRequest { string session_id = 1; }
message ListAuthorizationRolesResponse { repeated AuthorizationRole roles = 1; }

message RoleAssignment {
  string id = 1;
  string employee_id = 2;
  string role_id = 3;
  string reason = 4;
  google.protobuf.Timestamp assigned_at = 5;
  google.protobuf.Timestamp valid_from = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp revoked_at = 8;
  string assigned_by = 9;
  string source = 10;
}
message ListRoleAssignmentsRequest {
  string session_id = 1;
  string employee_id = 2;
  bool include_history = 3;
}
message ListRoleAssignmentsResponse { repeated RoleAssignment assignments = 1; }
message ListTenantRoleAssignmentsRequest {
  string session_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
}
message ListTenantRoleAssignmentsResponse {
  repeated RoleAssignment assignments = 1;
  string next_page_token = 2;
}
message AuthorizationAdminEvent {
  string id = 1;
  string action = 2;
  string subject_id = 3;
  string role_id = 4;
  string actor_employee_id = 5;
  string actor_database_user = 6;
  string change_reference = 7;
  google.protobuf.Timestamp occurred_at = 8;
  string reason = 9;
}
message ListAuthorizationAdminEventsRequest {
  string session_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
}
message ListAuthorizationAdminEventsResponse {
  repeated AuthorizationAdminEvent events = 1;
  string next_page_token = 2;
}

// Merchant is a seller's shop, owned by one employee (the penjual). Products in
// the product platform carry a merchant_id that references these rows; the auth
// module is the authority for who owns a merchant and who may manage its
// products.
message Merchant {
  string id = 1;
  string tenant_id = 2;
  string owner_employee_id = 3;
  string name = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// MerchantMembership is an employee's role inside one merchant. role is
// "owner" (penjual) or "karyawan"; a karyawan holds no product authority until
// the owner grants one.
message MerchantMembership {
  string tenant_id = 1;
  string merchant_id = 2;
  string employee_id = 3;
  string role = 4;
  string granted_by = 5;
  google.protobuf.Timestamp created_at = 6;
}

// MerchantInvitation is how an owner adds a karyawan. It carries a one-time
// token and expires.
message MerchantInvitation {
  string id = 1;
  string tenant_id = 2;
  string merchant_id = 3;
  string email = 4;
  string role = 5;
  string status = 6;
  string token = 7;
  google.protobuf.Timestamp expires_at = 8;
  string invited_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp accepted_at = 11;
  google.protobuf.Timestamp revoked_at = 12;
}

// RegisterAccountRequest creates a pembeli account.
message RegisterAccountRequest {
  string tenant_id = 1;
  string name = 2;
  string email = 3;
  string pin = 4;
}
message RegisterAccountResponse { Employee employee = 1; }

// OpenMerchantRequest opens a merchant owned by the session employee.
message OpenMerchantRequest {
  string session_id = 1;
  string name = 2;
}
message OpenMerchantResponse { Merchant merchant = 1; }

message ListMyMerchantsRequest { string session_id = 1; }
message ListMyMerchantsResponse { repeated Merchant merchants = 1; }

message GetMerchantRequest {
  string session_id = 1;
  string merchant_id = 2;
}
message GetMerchantResponse { Merchant merchant = 1; }

message ListMembersRequest {
  string session_id = 1;
  string merchant_id = 2;
}
message ListMembersResponse { repeated MerchantMembership members = 1; }

// InviteMemberRequest invites a karyawan to a merchant. Only the owner may.
message InviteMemberRequest {
  string session_id = 1;
  string merchant_id = 2;
  string email = 3;
  string role = 4;
}
message InviteMemberResponse { MerchantInvitation invitation = 1; }

message AcceptInvitationRequest {
  string session_id = 1;
  string token = 2;
}
message AcceptInvitationResponse { MerchantMembership membership = 1; }

message RevokeInvitationRequest {
  string session_id = 1;
  string invitation_id = 2;
}
message RevokeInvitationResponse {}

// GrantMerchantPermissionRequest delegates a supported capability to a
// karyawan member of a merchant. Only the owner may.
message GrantMerchantPermissionRequest {
  string session_id = 1;
  string merchant_id = 2;
  string employee_id = 3;
  string permission_key = 4;
}
message GrantMerchantPermissionResponse {}

message RevokeMerchantPermissionRequest {
  string session_id = 1;
  string merchant_id = 2;
  string employee_id = 3;
  string permission_key = 4;
}
message RevokeMerchantPermissionResponse {}

message ListMerchantPermissionsRequest {
  string session_id = 1;
  string merchant_id = 2;
  string employee_id = 3;
}
message ListMerchantPermissionsResponse { repeated string permission_keys = 1; }

// CanManageProductRequest asks the merchant-scoped PDP whether the session
// employee may modify products in the merchant.
message CanManageProductRequest {
  string session_id = 1;
  string merchant_id = 2;
}
message CanManageProductResponse { bool allowed = 1; }

service AuthService {
  rpc RegisterEmployee(RegisterEmployeeRequest) returns (RegisterEmployeeResponse);
  rpc GetEmployee(GetEmployeeRequest) returns (GetEmployeeResponse);
  rpc GetEmployeeByEmail(GetEmployeeByEmailRequest) returns (GetEmployeeByEmailResponse);
  rpc UpdateEmployee(UpdateEmployeeRequest) returns (UpdateEmployeeResponse);
  rpc ListEmployees(ListEmployeesRequest) returns (ListEmployeesResponse);
  rpc SetEmployeePIN(SetEmployeePINRequest) returns (SetEmployeePINResponse);
  rpc ActivateEmployee(ActivateEmployeeRequest) returns (ActivateEmployeeResponse);
  rpc DeactivateEmployee(DeactivateEmployeeRequest) returns (DeactivateEmployeeResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  rpc ExtendSession(ExtendSessionRequest) returns (ExtendSessionResponse);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc GrantPermission(GrantPermissionRequest) returns (GrantPermissionResponse);
  rpc RevokePermission(RevokePermissionRequest) returns (RevokePermissionResponse);
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  rpc RevokeRoleAssignment(RevokeRoleAssignmentRequest) returns (RevokeRoleAssignmentResponse);
  rpc ListAuthorizationRoles(ListAuthorizationRolesRequest) returns (ListAuthorizationRolesResponse);
  rpc ListRoleAssignments(ListRoleAssignmentsRequest) returns (ListRoleAssignmentsResponse);
  rpc ListTenantRoleAssignments(ListTenantRoleAssignmentsRequest) returns (ListTenantRoleAssignmentsResponse);
  rpc ListAuthorizationAdminEvents(ListAuthorizationAdminEventsRequest) returns (ListAuthorizationAdminEventsResponse);
  rpc RegisterAccount(RegisterAccountRequest) returns (RegisterAccountResponse);
  rpc OpenMerchant(OpenMerchantRequest) returns (OpenMerchantResponse);
  rpc ListMyMerchants(ListMyMerchantsRequest) returns (ListMyMerchantsResponse);
  rpc GetMerchant(GetMerchantRequest) returns (GetMerchantResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  rpc GrantMerchantPermission(GrantMerchantPermissionRequest) returns (GrantMerchantPermissionResponse);
  rpc RevokeMerchantPermission(RevokeMerchantPermissionRequest) returns (RevokeMerchantPermissionResponse);
  rpc ListMerchantPermissions(ListMerchantPermissionsRequest) returns (ListMerchantPermissionsResponse);
  rpc CanManageProduct(CanManageProductRequest) returns (CanManageProductResponse);
}
