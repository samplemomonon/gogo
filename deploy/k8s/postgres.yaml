# Postgres for what this process still owns: the inventory ledger and the sales history.
# The application repositories connect via DATABASE_URL and run embedded migrations on
# startup, so this service only has to bring the database up; no migrate job is needed.
#
# Product data is not here — product-service owns its own database (see ARCHITECTURE.md
# D-018).
apiVersion: v1
kind: Service
metadata:
  name: gogo-postgres
  namespace: gogo
  labels:
    app.kubernetes.io/name: gogo-postgres
    app.kubernetes.io/part-of: gogo
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: gogo-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gogo-postgres
  namespace: gogo
  labels:
    app.kubernetes.io/name: gogo-postgres
    app.kubernetes.io/part-of: gogo
spec:
  serviceName: gogo-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gogo-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gogo-postgres
        app.kubernetes.io/part-of: gogo
    spec:
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          # Debezium captures change data through a logical replication slot, so
          # the server must run with logical decoding enabled (and enough
          # slots/senders).
          args:
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=4
            - -c
            - max_wal_senders=4
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: gogo
            - name: POSTGRES_DB
              value: gogo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gogo-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gogo", "-d", "gogo"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "gogo", "-d", "gogo"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi