# Zero-trust network policy: by default nothing reaches or leaves the namespace except
# the explicitly permitted paths below. Adjust the "ingress controller" and "prometheus"
# pod selectors to your cluster.
#
# Note the egress rules: the gateway reaches the five product-platform services by
# *namespace*, not by pod selector, because those services are deployed by the platform's
# own manifests and may live outside this namespace. Selectors across a namespace boundary
# are what a podSelector in a single-namespace policy cannot express, so the rule names the
# namespace and ports instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: gogo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# DNS egress is required by every pod before it can resolve its peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gogo
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  namespace: gogo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gogo-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public web traffic arrives via the ingress controller.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus scraping /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # The inventory and sales stores this process owns.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gogo-postgres
      ports:
        - protocol: TCP
          port: 5432
    # The product platform's gRPC contracts: product (writes), product-listing
    # (browse), product-search (search), category (the hierarchy), media (images).
    # One rule, five ports, because they are five views of one dependency rather
    # than five unrelated ones.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: product
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9091
    # The product change feed, so island caches are dropped when a product changes
    # outside this process. Drop this rule along with KAFKA_BROKERS if the gateway runs
    # on its cache TTLs alone.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: product
      ports:
        - protocol: TCP
          port: 9092
          # Kafka's advertised listener port. The platform's deployment chooses it;
          # match it to the KAFKA_BROKERS value in configmap.yaml.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: gogo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gogo-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gogo-gateway
      ports:
        - protocol: TCP
          port: 5432
