# TEMPLATE ONLY — never commit real secrets.
#
# Create the real secret, then deploy:
#
#   kubectl -n gogo create secret generic gogo-secrets \
#     --from-literal=DATABASE_URL='postgres://gogo:CHANGE_ME@gogo-postgres.gogo.svc.cluster.local:5432/gogo?sslmode=disable' \
#     --from-literal=POSTGRES_PASSWORD='CHANGE_ME'
#
# The gateway loads DATABASE_URL from this secret via envFrom, and the postgres
# StatefulSet reads POSTGRES_PASSWORD from the same secret. The product platform's own
# credentials live in the platform's secrets, not here.
apiVersion: v1
kind: Secret
metadata:
  name: gogo-secrets
  namespace: gogo
  labels:
    app.kubernetes.io/part-of: gogo
type: Opaque
stringData:
  # Password used by the postgres StatefulSet bootstrap.
  POSTGRES_PASSWORD: "CHANGE_ME"
  # Full connection string consumed by the application config (DATABASE_URL): the
  # inventory ledger and the sales history.
  DATABASE_URL: "postgres://gogo:CHANGE_ME@gogo-postgres.gogo.svc.cluster.local:5432/gogo?sslmode=disable"
  # Must match a token accepted by the product platform's gRPC services.
  PRODUCT_PLATFORM_SERVICE_TOKEN: "CHANGE_ME_TO_A_SHARED_SERVICE_TOKEN"
